<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cubos &mdash; Cases</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#060e14;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;text-align:center;gap:16px;padding:40px}
h1{font-size:48px;font-weight:300}
p{color:rgba(255,255,255,.6);font-size:18px;max-width:500px;line-height:1.6}
.cases{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:32px;width:100%;max-width:800px}
.card{background:rgba(255,255,255,.05);border:.5px solid rgba(255,255,255,.1);padding:32px;text-align:left;border-radius:4px}
.num{font-size:40px;font-weight:200;color:#fff;font-style:italic}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:rgba(255,255,255,.4);margin-bottom:12px}
.tag{font-size:14px;color:rgba(255,255,255,.5);margin-top:8px;line-height:1.5}
</style>
</head>
<body>
<h1>Cases Cubos</h1>
<p>Projetos reais, numeros concretos.</p>
<div class="cases">
<div class="card"><div class="label">WeWork Latam</div><div class="num">R$ 250 mil</div><div class="tag">/ano economizados em cartoes fisicos</div></div>
<div class="card"><div class="label">Zig Delivery</div><div class="num">R$ 1,06 mi</div><div class="tag">no primeiro mes apos o relancamento</div></div>
<div class="card"><div class="label">Quipu</div><div class="num">320%</div><div class="tag">da meta do time de vendas do iFood</div></div>
<div class="card"><div class="label">Cubos DevOps</div><div class="num">90%</div><div class="tag">de reducao em custos de cloud em 40 dias</div></div>
</div>
</body>
</html>
